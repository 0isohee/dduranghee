<style>
:root{
  color-scheme:light;
  --field:#EDE8DF;
  --bg:#F7F4EE;
  --surface:#FFFFFF;
  --surface-2:#FAF7F1;
  --ink:#1F1B16;
  --muted:#56504A;
  --faint:#8A8177;
  --line:#E3DCD1;
  --line-strong:#C9C0B3;
  --done:#A44A26;
  --done-soft:#F2E2DA;
  --done-ink:#8A3D1E;
  --miss:#2A5FA5;
  --miss-soft:#DCE7F5;
  --miss-ink:#1D4A85;
  --wait:#8A6A17;
  --wait-soft:#FBF0D8;
  --wait-ink:#6E5310;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(31,27,22,.06), 0 8px 24px rgba(31,27,22,.07);
  --r:14px;
  --display:'Gowun Batang',Georgia,'Apple SD Gothic Neo',serif;
  --body:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --field:#0E0C09;--bg:#17140F;--surface:#211D17;--surface-2:#1B1712;
    --ink:#F0EBE2;--muted:#A79E93;--faint:#7E766C;--line:#332D25;--line-strong:#463F35;
    --done:#D07A50;--done-soft:#3A2418;--done-ink:#E8A583;
    --miss:#6796DC;--miss-soft:#1A2740;--miss-ink:#9FBDEE;
    --wait:#C9A23E;--wait-soft:#332815;--wait-ink:#E0C374;
    --on-accent:#17140F;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --field:#0E0C09;--bg:#17140F;--surface:#211D17;--surface-2:#1B1712;
  --ink:#F0EBE2;--muted:#A79E93;--faint:#7E766C;--line:#332D25;--line-strong:#463F35;
  --done:#D07A50;--done-soft:#3A2418;--done-ink:#E8A583;
  --miss:#6796DC;--miss-soft:#1A2740;--miss-ink:#9FBDEE;
  --wait:#C9A23E;--wait-soft:#332815;--wait-ink:#E0C374;
  --on-accent:#17140F;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.4);
}
html{
  height:100%;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--field);
}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;overflow:hidden;
  background:var(--field);color:var(--ink);
  font-family:var(--body);font-size:15px;line-height:1.55;
  display:flex;justify-content:center;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.phone{position:relative;width:100%;max-width:460px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:620px){.phone{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
img{max-width:100%}
button{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--done);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
.stack{display:flex;flex-direction:column}
.g6{gap:6px}.g7{gap:7px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g18{gap:18px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.center{align-items:center;justify-content:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.plain{background:none;border:none;padding:0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.sub{font-size:12.5px;color:var(--muted)}
.tiny{font-size:11px;color:var(--muted)}

.btn{border:1px solid transparent;border-radius:12px;background:var(--done);color:var(--on-accent);
  min-height:50px;padding:0 18px;font-weight:700;font-family:var(--display);font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.sm{min-height:42px;font-size:14px;padding:0 14px;border-radius:11px}
.btn.wide{width:100%}
.chip{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:999px;min-height:36px;padding:0 13px;font-size:13px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--on-accent);font-weight:700}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg .chip{flex:1 1 0;justify-content:center;min-width:70px}

.field-l{font-size:12.5px;font-weight:700;color:var(--ink)}
.inp{width:100%;min-height:48px;padding:11px 13px;border:1px solid var(--line-strong);
  border-radius:12px;background:var(--surface);line-height:1.5}
textarea.inp{resize:none;min-height:78px}
.inp:focus{border-color:var(--done);outline:none}
.inp.need{border-color:var(--miss)}

.av{border-radius:50%;background:var(--done-soft);color:var(--done-ink);
  font-family:var(--display);font-weight:700;display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex:0 0 auto}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av-28{width:28px;height:28px;font-size:11px}
.av-30{width:30px;height:30px;font-size:12px}
.av-34{width:34px;height:34px;font-size:13px}
.av-40{width:40px;height:40px;font-size:14px}
.av-52{width:52px;height:52px;font-size:18px}

.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.pill.done{background:var(--done-soft);color:var(--done-ink)}
.pill.miss{background:var(--miss-soft);color:var(--miss-ink)}
.pill.wait{background:var(--wait-soft);color:var(--wait-ink)}
.pill.flat{background:var(--surface-2);color:var(--muted)}

.top{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px}
.mnav{display:flex;align-items:center;justify-content:center;gap:4px}
.mnav button{background:none;border:none;width:44px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:10px}
.mnav .mlabel{font-family:var(--display);font-weight:800;font-size:17px;min-width:116px;text-align:center}
.tabs{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs button{flex:1 1 0;background:none;border:none;min-height:58px;padding:6px 2px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--done);font-weight:700}
.tb{position:relative;display:flex}
.dotn{position:absolute;transform:translate(13px,-9px);min-width:16px;height:16px;border-radius:8px;background:var(--miss);color:var(--on-accent);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:2px}
.dow.sun{color:var(--miss)}
.cell{position:relative;aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:500;color:var(--muted);padding:0}
.cell.blank{background:none}
.cell.done{background:var(--done);border-color:var(--done);color:var(--on-accent);font-weight:600}
.cell.miss{background:var(--miss-soft);border-color:var(--miss);color:var(--miss-ink)}
.cell.pending,.cell.hold{background:var(--wait-soft);border-color:var(--wait);color:var(--wait-ink);font-weight:600}
.cell.today{background:var(--surface);border:2px dashed var(--line-strong);color:var(--ink);font-weight:600}
.cell.future,.cell.none{background:none;color:var(--faint)}
.bonus{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;
  background:var(--done-ink);color:var(--on-accent);font-family:var(--mono);font-size:9.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.sw{width:12px;height:12px;border-radius:4px;border:1px solid transparent;flex:0 0 auto}

.track{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);display:flex;overflow:hidden}
.fill{border-radius:5px;background:var(--done);min-width:3px}
.sbar{display:flex;gap:2px;height:16px}
.sbar span{display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:var(--on-accent);overflow:hidden}
.sbar .sd{background:var(--done);border-radius:5px 3px 3px 5px}
.sbar .sm{background:var(--miss);border-radius:3px 5px 5px 3px}

.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shot{display:block;position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.shot.thumb{aspect-ratio:4/3}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .kill{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;
  border:none;background:rgba(10,14,19,.68);color:#fff;display:flex;align-items:center;justify-content:center}
.addshot{aspect-ratio:1/1;border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:12px;font-weight:600;color:var(--muted)}
.ph{display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:var(--faint)}

.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.shead{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.shead h2{font-size:17px;font-weight:800}
.iconbtn{background:none;border:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:10px}
.foot{flex:0 0 auto;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:flex-end}

.note{border-radius:12px;padding:11px 13px;display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.6}
.note.info{background:var(--done-soft);color:var(--done-ink)}
.note.warn{background:var(--miss-soft);color:var(--miss-ink)}
.note svg{flex:0 0 auto;margin-top:2px}
.divider{height:1px;background:var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.postcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.code{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:.08em;background:var(--surface-2);
  border:1px dashed var(--line-strong);border-radius:10px;padding:10px 12px;user-select:all;-webkit-user-select:all;word-break:break-all}
.link{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px dashed var(--line-strong);
  border-radius:10px;padding:9px 11px;user-select:all;-webkit-user-select:all;word-break:break-all;line-height:1.5}
.hero{font-family:var(--display);font-weight:800;line-height:1}
.toast{position:absolute;left:16px;right:16px;bottom:78px;z-index:60;background:var(--ink);color:var(--bg);
  padding:11px 14px;border-radius:12px;font-size:13px;text-align:center;box-shadow:var(--shadow)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{list-style:none;counter-increment:s;position:relative;padding-left:30px;font-size:13px;line-height:1.65}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;
  background:var(--done);color:var(--on-accent);font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
</style>
</head>

<script type="module">
/* =======================================================================
   뚜랑희 챌린지 — 가족 목표 인증 앱
   데이터: Firebase (Firestore + 익명 로그인). config.js에 설정을 넣으세요.

const ICON = {

  left:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>',
  send:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14M13 6l6 6-6 6"/></svg>',
  copy:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/></svg>'
};

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const p2 = n => n<10?'0'+n:''+n;
const ymOf = d => d.getFullYear()+'-'+p2(d.getMonth()+1);
const dstrOf = d => ymOf(d)+'-'+p2(d.getDate());
const dim = ym => { const a=ym.split('-'); return new Date(+a[0],+a[1],0).getDate(); };
const dow1 = ym => { const a=ym.split('-'); return new Date(+a[0],+a[1]-1,1).getDay(); };
const shiftYm = (ym,k) => { const a=ym.split('-'); return ymOf(new Date(+a[0],+a[1]-1+k,1)); };

function configLooksSet(){
  const c = window.FIREBASE_CONFIG;
  if(!c || !c.projectId || !c.apiKey) return false;
  return !/여기에|PASTE|YOUR_/.test(c.projectId + c.apiKey + (c.appId||''));
}
async function loadSdk(){
  const versions = [window.FIREBASE_SDK_VERSION, '12.19.0', '11.10.0', '10.12.2'].filter(Boolean);
  let last=null;
  for(const v of versions){
    try{
      const base = 'https://www.gstatic.com/firebasejs/'+v+'/';
      const [app, auth, fs] = await Promise.all([
        import(base+'firebase-app.js'),
        import(base+'firebase-auth.js'),
        import(base+'firebase-firestore.js')
      ]);
      return {app, auth, fs, version:v};
    }catch(e){ last=e; }
  }
  throw last || new Error('SDK를 불러오지 못했습니다.');
}
async function initFirebase(){
  const sdk = await loadSdk();
  const app = sdk.app.initializeApp(window.FIREBASE_CONFIG);
  const auth = sdk.auth.getAuth(app);
  const db = sdk.fs.getFirestore(app);
  let uid;
  try{
    const cred = await sdk.auth.signInAnonymously(auth);
    uid = cred.user.uid;
  }catch(e){
    const err = new Error('anon');
    err.detail = e && e.code || '';
    throw err;
  }
  return {fs:sdk.fs, db, uid, version:sdk.version};
}

/* ---------------- data accessors ---------------- */
const members = () => (S.room && S.room.members) || {};
const memberIds = () => { const m=members(); return Object.keys(m).sort((a,b)=>(m[a].joinedAt||0)-(m[b].joinedAt||0)); };
const member = id => members()[id] || null;
const goals = () => (S.monthDoc && S.monthDoc.goals) || {};
const goalOf = id => goals()[id] || null;
const myGoal = () => goalOf(S.mid);
/* 방에 나 말고 아무도 없으면 확인해줄 사람이 없으므로 0명 — 올리는 즉시 달성입니다.
   가족이 들어오면 목표에 저장된 설정이 그때부터 적용됩니다. */
const otherCount = id => memberIds().filter(x => x !== id).length;
function neededFor(id){
  const others = otherCount(id);
  if(others === 0) return 0;
  const g = goalOf(id); if(!g) return 1;
  if(g.reviewers === 0 || g.reviewers === 'all') return others;
  return clamp(+g.reviewers || 1, 1, others);
}
const postId = (ds,id) => ds+'_'+id;
const postOf = (id,ds) => S.posts.find(p => p.mid===id && p.date===ds) || null;
const nApprove = p => Object.values((p&&p.approvals)||{}).filter(Boolean).length;
const nHold = p => Object.values((p&&p.holds)||{}).filter(Boolean).length;
const joinDs = id => { const m=member(id); return m&&m.joinedAt ? dstrOf(new Date(m.joinedAt)) : null; };

/* 점수는 달성률에 정확히 비례합니다. 목표 30분에 55분이면 1.8배 → +1.8점.
   목표치에 못 미친 날은 확인 여부와 상관없이 -1점입니다. */
const r1 = n => Math.round(n*10)/10;
const fmtNum = n => { const v = r1(n); return Number.isInteger(v) ? String(v) : v.toFixed(1); };
const fmtPt = n => { const v = r1(n); return (v>0?'+':'') + fmtNum(v); };
function ratioOf(id, p){
  const g = goalOf(id);
  const t = parseFloat(g && g.target);
  const v = parseFloat(p && p.value);
  if(!isFinite(t) || t <= 0 || !isFinite(v)) return null;
  return v / t;
}
const isShort = (id, p) => { const r = ratioOf(id, p); return r !== null && r < 1; };

function statusOf(id, ds){
  const td = today();
  if(ds > td) return 'future';
  if(!goalOf(id)) return 'none';
  const jd = joinDs(id); if(jd && ds < jd) return 'none';
  const p = postOf(id, ds);
  if(p){
    if(isShort(id, p)) return 'miss';
    if(nApprove(p) >= neededFor(id)) return 'done';
    if(nHold(p) > 0) return ds===td ? 'hold' : 'miss';
    return ds===td ? 'pending' : 'miss';
  }
  return ds===td ? 'today' : 'miss';
}
function pointsOf(id, ds){
  const st = statusOf(id, ds);
  if(st === 'done'){
    const r = ratioOf(id, postOf(id, ds));
    return r === null ? 1 : Math.max(1, r1(r));
  }
  return st === 'miss' ? -1 : 0;
}
function statsOf(id){
  const n = dim(S.ym);
  let done=0, miss=0, pend=0, best=0, run=0, score=0, bonus=0;
  for(let d=1; d<=n; d++){
    const ds = S.ym+'-'+p2(d), st = statusOf(id, ds);
    score += pointsOf(id, ds);
    if(st==='done'){ done++; run++; if(run>best) best=run; if(pointsOf(id,ds) > 1) bonus++; }
    else { if(st==='miss') miss++; if(st==='pending'||st==='hold') pend++; run=0; }
  }
  return {done, miss, pend, score:r1(score), streak:best, bonus};
}
function ranked(){
  const out = memberIds().map(id => Object.assign(statsOf(id), {id}));
  out.sort((a,b) => b.score-a.score || b.done-a.done || a.id.localeCompare(b.id));
  let rank=0, prev=null;
  out.forEach((r,i) => { if(prev===null || r.score!==prev){ rank=i+1; prev=r.score; } r.rank=rank; });
  return out;
}
function pendingForMe(){
  return S.posts.filter(p =>
    p.mid!==S.mid &&
    nApprove(p) < neededFor(p.mid) &&
    !(p.approvals||{})[S.mid] &&
    !(p.holds||{})[S.mid]
  );
}
function hoursToMidnight(){
  const now = new Date();
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1);
  const ms = end-now;
  return {h:Math.floor(ms/3600000), m:Math.floor(ms%3600000/60000)};
}

function failMsg(e){
  const c = (e && e.code) || '';
  if(c.includes('permission-denied')) return 'Firestore 보안 규칙에서 막혔어요. README의 규칙을 다시 확인해 주세요.';
  if(c.includes('unavailable')) return '인터넷 연결을 확인해 주세요.';
  if(c.includes('resource-exhausted')) return 'Firebase 무료 한도를 넘었어요. 잠시 후 다시 시도해 주세요.';
  if(c.includes('invalid-argument')) return '사진이 너무 커요. 한 장만 올리거나 다시 골라 주세요.';
  return '저장하지 못했어요. 다시 시도해 주세요.';
}

/* ---------------- photos ---------------- */
function readImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => res({img, url});
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
async function shrink(file, maxSide, q){
  const r = await readImage(file);
  try{
    let w = r.img.naturalWidth || r.img.width, h = r.img.naturalHeight || r.img.height;
    const s = Math.min(1, maxSide/Math.max(w,h));
    w = Math.max(1, Math.round(w*s)); h = Math.max(1, Math.round(h*s));
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
    ctx.drawImage(r.img, 0, 0, w, h);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(r.url); }
}
/* Firestore 문서는 1MB까지라, 사진 2장이 들어가도 넉넉하도록 줄여 담습니다. */
async function takePhoto(file){
  let d = await shrink(file, 880, 0.68);
  if(d.length > 130000) d = await shrink(file, 700, 0.58);
  if(d.length > 130000) d = await shrink(file, 560, 0.5);
  return {d};
}
async function takeAvatar(file){ return {d: await shrink(file, 240, 0.7)}; }

      const gg = S.monthDoc.goals[id];
      const tgt = parseFloat(gg.target) || 1;
      const mult = 1 + ((d + k) % 4) * 0.4;
      const vv = Math.round(tgt*mult*10)/10;
      S.posts.push({id:postId(ds,id), mid:id, date:ds, month:S.ym,
        caption: gg.title+' / 목표 '+gg.target+gg.unit+' · 오늘 '+vv+gg.unit,
        value: vv,
        photos:[{}], createdAt:Date.parse(ds+'T12:00:00')||Date.now(),
        approvals:appr, holds:{},
        comments: d%6===0 ? [{id:rnd(6), mid:'mom', text:'오늘도 잘했어요', at:Date.now()}] : []});
    }
  });
}

const clearSubs = a => (a||[]).forEach(f => { try{ f(); }catch(e){} });
function watchRoom(){
  clearSubs(S.subs); S.subs = [];
  if(!S.fb || !S.roomId) return;
  S.subs.push(S.fb.fs.onSnapshot(F.roomRef(), snap => {
    S.roomLoaded = true;
    S.room = snap.exists() ? snap.data() : null;
    render();
  }, e => { S.roomLoaded = true; say(failMsg(e)); }));
  watchMonth();
}
function watchMonth(){
  clearSubs(S.msubs); S.msubs = [];
  if(!S.fb || !S.roomId) return;
  const fs = S.fb.fs;
  S.msubs.push(fs.onSnapshot(F.monthRef(), snap => {
    S.monthDoc = snap.exists() ? snap.data() : null; render();
  }, e => say(failMsg(e))));
  S.msubs.push(fs.onSnapshot(fs.query(F.postsCol(), fs.where('month','==',S.ym)), snap => {
    S.posts = snap.docs.map(d => Object.assign({}, d.data(), {id:d.id}));
    render();
  }, e => say(failMsg(e))));
}

/* 로그인 ── 방장이 앱 안에서 만든 아이디와 4자리 비밀번호로 들어옵니다.
   Firebase 익명 로그인은 데이터 접근 권한을 받기 위해 뒤에서 계속 쓰이고,
   "누가 누구인지"는 여기 아이디로 정합니다. 그래서 폰이나 브라우저가 바뀌어도
   같은 아이디로 들어오면 같은 사람입니다. */
const sessKey = () => 'ddr_login_' + S.roomId;
const pwMemoKey = id => 'ddr_pw_' + S.roomId + '_' + id;
function applySession(){
  if(S.demo) return;
  S.mid = S.roomId ? (LS.get(sessKey()) || null) : null;
}
const normId = s => String(s||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,20);
const isOwner = () => !!(S.room && S.room.createdBy === S.mid);

function fnv(s){
  let h = 0x811c9dc5;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8,'0');
}
/* 비밀번호는 원문이 아니라 해시만 저장합니다. 네 자리 숫자라 강력한 보안은 아니고,
   가족끼리 누가 누군지 구분하고 실수로 남의 이름으로 올리지 않게 하는 장치입니다. */
async function hashPw(loginId, pw){
  const msg = S.roomId + ':' + loginId + ':' + pw;
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
      return 's1:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return 'f1:' + fnv(msg) + fnv(msg+'#2');
}
async function verifyPw(stored, loginId, pw){
  if(!stored) return false;
  if(stored.indexOf('f1:')===0){
    const msg = S.roomId + ':' + loginId + ':' + pw;
    return stored === 'f1:' + fnv(msg) + fnv(msg+'#2');
  }
  return (await hashPw(loginId, pw)) === stored;
}

function screenName(){
  if(S.setupError) return 'setup';
  if(!S.ready) return 'boot';
  if(!S.roomId) return 'start';
  if(!S.roomLoaded) return 'boot';
  if(!S.room) return 'nofind';
  if(!S.mid || !member(S.mid)) return 'login';
  if(!member(S.mid).setup) return 'profile';
  if(S.ym===curYm() && !myGoal()) return 'goal';
  return 'main';
}

/* ---------------- render ---------------- */
const root = document.getElementById('screen');
let lastFocus = null;

function render(){
  const n = screenName();
  let html =
    n==='boot' ? viewBoot() :
    n==='setup' ? viewSetup() :
    n==='start' ? viewStart() :
    n==='nofind' ? viewNoFind() :
    n==='login' ? viewLogin() :
    n==='profile' ? viewProfile() :
    n==='goal' ? viewGoal() : viewMain();
  if(S.sheet==='verify') html += sheetVerify();
  if(S.sheet==='detail') html += sheetDetail();
  root.innerHTML = html;
  document.querySelectorAll('.toast').forEach(t => t.remove());
  if(S.flash){
    const d = document.createElement('div');
    d.className = 'toast'; d.setAttribute('role','status'); d.textContent = S.flash;
    document.getElementById('phone').appendChild(d);
  }
  if(lastFocus){
    const el = document.getElementById(lastFocus.id);
    if(el){ el.focus(); try{ el.setSelectionRange(lastFocus.pos, lastFocus.pos); }catch(e){} }
    lastFocus = null;
  }
}

function tabFeed(){

function tabRank(){
  const r = ranked();
  let max = 1; r.forEach(x => { max = Math.max(max, Math.abs(x.score)); });
  const td = today(), isCur = S.ym===curYm();
  const left = isCur ? (dim(S.ym) - (+td.split('-')[2])) : 0;
  let doneToday = 0;
  memberIds().forEach(id => { const s = statusOf(id, td); if(s==='done'||s==='pending') doneToday++; });
  let totalDone = 0, totalDays = 0;
  r.forEach(x => { totalDone += x.done; totalDays += x.done + x.miss + x.pend; });
  const rate = totalDays ? Math.round(totalDone/totalDays*100) : 0;

  const rows = r.map(x => {
    const pct = Math.max(3, Math.round(Math.max(0,x.score)/max*100));
    const g = goalOf(x.id);
    return '<div class="card stack g8"'+(x.rank===1?' style="border-color:var(--done);border-width:1.5px;background:var(--done-soft)"':'')+'>'+
      '<div class="row g10">'+
        '<span class="num" style="width:20px;text-align:center;font-weight:600;color:'+(x.rank===1?'var(--done-ink)':'var(--faint)')+'">'+x.rank+'</span>'+
        avatar(x.id,34)+
        '<span class="grow stack" style="gap:1px;min-width:0">'+
          '<span style="font-size:13.5px;font-weight:700">'+esc(nameOf(x.id))+(x.id===S.mid?' <span class="tiny">(나)</span>':'')+'</span>'+
          '<span class="tiny" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(g?g.title+' · 목표 '+(g.target||'-')+(g.unit||''):'목표 없음')+'</span>'+
        '</span>'+
        '<span class="num" style="font-size:18px;font-weight:600;color:'+(x.score<0?'var(--miss)':'var(--ink)')+'">'+fmtPt(x.score)+'</span>'+
      '</div>'+
      '<div class="row g10">'+
        '<span class="track grow"><span class="fill" style="width:'+pct+'%"></span></span>'+
        '<span class="tiny num" style="flex:0 0 auto">달성 '+x.done+' · 미달성 '+x.miss+(x.bonus?' · 초과달성 '+x.bonus:'')+'</span>'+
      '</div>'+
    '</div>';
  }).join('');

  const sbars = r.map(x => {
    const tot = Math.max(1, x.done+x.miss);
    return '<div class="stack g6">'+
      '<div class="row g8" style="align-items:baseline">'+
        '<span class="grow" style="font-size:13px;font-weight:600">'+esc(nameOf(x.id))+'</span>'+
        '<span class="tiny num">최장 연속 '+x.streak+'일</span>'+
      '</div>'+
      '<div class="sbar">'+
        (x.done?'<span class="sd" style="flex:'+x.done+'">'+(x.done/tot>0.16?x.done+'일':'')+'</span>':'')+
        (x.miss?'<span class="sm" style="flex:'+x.miss+'">'+(x.miss/tot>0.16?x.miss+'일':'')+'</span>':'')+
        (!x.done&&!x.miss?'<span style="flex:1;background:var(--surface-2);border-radius:5px"></span>':'')+
      '</div>'+
    '</div>';
  }).join('');

  const champ = r[0];
  return '<div class="pad stack g14">'+
    '<div class="row g10" style="align-items:stretch">'+
      '<div class="card grow stack" style="gap:2px">'+
        '<span class="lbl">'+(isCur?'남은 기간':'이 달 기록')+'</span>'+
        '<span class="num hero" style="font-size:22px">'+(isCur?left+'일':dim(S.ym)+'일')+'</span>'+
      '</div>'+
      '<div class="card grow stack" style="gap:2px">'+
        '<span class="lbl">'+(isCur?'오늘 인증':'달성률')+'</span>'+
        '<span class="num hero" style="font-size:22px">'+(isCur?doneToday+' <span style="font-size:13px;font-family:var(--body);color:var(--muted)">/ '+memberIds().length+'명</span>':rate+'%')+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="row g8" style="align-items:baseline">'+
      '<h2 class="grow" style="font-size:14px;font-weight:700">'+(isCur?'현재 순위':'최종 순위')+'</h2>'+
      '<span class="tiny">'+(S.demo?'예시 데이터':'실시간')+' · 달성률만큼 더하고 미달성은 1점씩 빼요</span>'+
    '</div>'+ rows +
    (champ && champ.score>0 ? '<div class="note info">'+ICON.medal+'<span><strong>'+esc(nameOf(champ.id))+'</strong>님이 '+esc(ymLabel(S.ym))+' 1등이에요 — '+fmtPt(champ.score)+'점, '+champ.done+'일 달성.</span></div>' : '')+
    '<div class="divider"></div>'+
    '<div class="row g8" style="align-items:baseline">'+
      '<h2 class="grow" style="font-size:14px;font-weight:700">사람별 기록</h2>'+
      '<span class="legend"><span><span class="sw" style="background:var(--done)"></span>달성</span><span><span class="sw" style="background:var(--miss)"></span>미달성</span></span>'+
    '</div>'+
    '<div class="card stack g12">'+sbars+'</div>'+
  '</div>';

function timeAgo(t){
  if(!t) return '';
  const s = Math.floor((Date.now()-t)/1000);
  if(s<60) return '방금';
  if(s<3600) return Math.floor(s/60)+'분 전';
  if(s<86400) return Math.floor(s/3600)+'시간 전';
  return Math.floor(s/86400)+'일 전';
}

/* ---------------- interaction ---------------- */
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
function collectGoal(pre){
  const base = (S.draft.goal !== undefined && S.draft.goalYm===S.ym) ? S.draft.goal : (goalOf(S.mid) || {});
  const t = document.getElementById(pre+'title'), g = document.getElementById(pre+'target'), u = document.getElementById(pre+'unit');
  return {
    title: t ? t.value.trim() : (base.title||''),
    target: g ? g.value.trim() : (base.target||''),
    unit: u ? u.value.trim() : (base.unit||''),
    reviewers: base.reviewers==null ? 1 : base.reviewers
  };
}
function openSheet(name, data){
  S.sheet = name; S.sheetData = data || null;
  if(name==='verify'){
    const ex = postOf(S.mid, today()), g = myGoal() || {};
    S.draft.photos = ex && ex.photos ? ex.photos.slice(0,2).filter(p => p && p.d) : [];
    S.draft.caption = ex ? (ex.caption||'') : ((g.title||'') + (g.target ? ' / 목표 '+g.target+(g.unit||'') : '') + ' · 오늘 ');
    S.draft.value = ex && ex.value != null ? String(ex.value) : '';
  }
  render();
}
function closeSheet(){
  S.sheet = null; S.sheetData = null;
  S.draft.photos = []; S.draft.caption = ''; S.draft.value = '';
  render();
}
function selectText(id, msg){
  const b = document.getElementById(id);
  if(b && window.getSelection){
    const r = document.createRange(); r.selectNodeContents(b);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  say(msg);
}
function copyText(text, id, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => say(okMsg), () => selectText(id, '길게 눌러 복사해 주세요.'));
  } else selectText(id, '길게 눌러 복사해 주세요.');
}

document.addEventListener('click', ev => {
  const el = ev.target.closest && ev.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act'), v = el.getAttribute('data-v');

  if(act==='tab'){ S.tab = v; S.flash=''; render(); return; }
  if(act==='ym'){
    const nx = shiftYm(S.ym, +v);
    if(+v > 0 && nx > curYm()) return;
    S.ym = nx; S.draft.goal = undefined; if(S.fb) watchMonth(); render(); return;
  }
  if(act==='ymset'){ S.ym = v; S.draft.goal = undefined; if(S.fb) watchMonth(); render(); return; }
  if(act==='filter'){ S.filter = v; render(); return; }
  if(act==='verify'){ openSheet('verify'); return; }
  if(act==='open'){ openSheet('detail', v); return; }
  if(act==='close'){ closeSheet(); return; }
  if(act==='day'){
    const p = postOf(S.mid, v);
    if(p) openSheet('detail', p.id);
    else if(v===today()) openSheet('verify');
    else say(dLabel(v)+'에는 인증이 없어요.');
    return;
  }
  if(act==='who'){
    const p = postOf(v, today());
    if(p) openSheet('detail', p.id); else { S.tab='feed'; render(); }
    return;
  }
  if(act==='rv'){
    const cur = collectGoal(screenName()==='goal' ? 'g-' : 'e-');
    cur.reviewers = +v; S.draft.goal = cur; S.draft.goalYm = S.ym; render(); return;
  }
  if(act==='create'){
    const rn = val('i-roomname'), mn = val('i-myname'), lid = normId(val('i-myid')), pw = val('i-mypw');
    if(!mn){ say('내 이름을 넣어주세요.'); return; }
    if(lid.length < 2){ say('아이디는 영문·숫자 2자 이상으로 지어주세요.'); return; }
    if(!/^[0-9]{4}$/.test(pw)){ say('비밀번호는 숫자 4자리로 넣어주세요.'); return; }
    LS.set('ddr_lastroom', rn);
    doCreateRoom(rn, mn, lid, pw); return;
  }
  if(act==='login'){
    const lid = normId(val('i-lid')), pw = val('i-lpw');
    if(!lid){ say('아이디를 넣어주세요.'); return; }
    if(!pw){ say('비밀번호를 넣어주세요.'); return; }
    doLogin(lid, pw); return;
  }
  if(act==='logout'){ doLogout(); return; }
  if(act==='saveprofile'){
    const nm = val('i-name');
    if(!nm){ say('이름을 넣어주세요.'); return; }
    doSaveProfile(nm, S.draft.avatar); return;
  }
  if(act==='acctopen'){ S.acctOpen = true; S.newAcct = null; render(); return; }
  if(act==='acctclose'){ S.acctOpen = false; render(); return; }
  if(act==='acctdone'){ S.newAcct = null; render(); return; }
  if(act==='addm'){
    const nm = val('a-name'), lid = normId(val('a-id')), pw = val('a-pw');
    if(!nm){ say('이름을 넣어주세요.'); return; }
    if(lid.length < 2){ say('아이디는 영문·숫자 2자 이상으로 지어주세요.'); return; }
    if(!/^[0-9]{4}$/.test(pw)){ say('비밀번호는 숫자 4자리로 넣어주세요.'); return; }
    doAddMember(nm, lid, pw); return;
  }
  if(act==='resetpw'){ doResetPw(v, String(Math.floor(Math.random()*9000)+1000)); return; }
  if(act==='rmask'){ S.confirmRm = v; render(); return; }
  if(act==='rmyes'){ doRemoveMember(v); return; }
  if(act==='copyacct'){ copyText(acctText(v), 'acctbox', '전달 문구를 복사했어요.'); return; }
  if(act==='joincode'){
    const c = val('i-code').toLowerCase().replace(/[^a-z0-9_-]/g,'');
    if(!c){ say('참여 코드를 넣어주세요.'); return; }
    if(S.demo){ say('체험 모드에서는 방에 참여할 수 없어요.'); return; }
    S.roomId = c; S.roomLoaded = false; LS.set('ddr_room', c); setHash(c); applySession();
    watchRoom(); render(); return;
  }
  if(act==='demo'){ S.setupError = null; demoInit(); S.ready = true; render(); return; }
  if(act==='reset'){
    S.roomId = null; S.room = null; S.roomLoaded = false; S.posts = []; S.monthDoc = null;
    LS.del('ddr_room'); try{ history.replaceState(null,'',location.pathname); }catch(e){}
    clearSubs(S.subs); clearSubs(S.msubs); S.subs=[]; S.msubs=[];
    render(); return;
  }
  if(act==='pickav'){ const f = document.getElementById('f-av'); if(f) f.click(); return; }
  if(act==='savegoal'){
    const g = collectGoal(screenName()==='goal' ? 'g-' : 'e-');
    if(!g.title){ say('목표 이름을 넣어주세요.'); return; }
    if(!g.target){ say('하루 목표치를 넣어주세요. 캡션에 이 수치를 적게 돼요.'); return; }
    g.updatedAt = Date.now();
    S.draft.goal = undefined;
    doSaveGoal(el.getAttribute('data-ym') || S.ym, g); return;
  }
  if(act==='pickshot'){ S.draft.slot = +v; const f = document.getElementById('f-shot'); if(f) f.click(); return; }
  if(act==='rmshot'){ S.draft.caption = val('i-cap'); S.draft.photos.splice(+v,1); render(); return; }
  if(act==='submit'){
    const cap = val('i-cap'), vv = val('i-val'), g = myGoal() || {};
    if(!S.draft.photos.length){ say('사진을 최소 1장 올려주세요.'); return; }
    if(!vv || !isFinite(parseFloat(vv))){ say('오늘 달성치를 숫자로 넣어주세요.'); return; }
    if(!cap){ say('캡션은 필수예요. 목표와 목표치를 적어주세요.'); return; }
    if(g.target && cap.indexOf(String(g.target))===-1){
      S.draft.caption = cap; say('캡션에 목표치 '+g.target+(g.unit||'')+'를 넣어주세요.'); render(); return;
    }
    doPost(today(), cap, S.draft.photos.slice(0,2), parseFloat(vv)); return;
  }
  if(act==='ok' || act==='hold'){
    const p = S.posts.find(x => x.id===S.sheetData);
    if(p) doReview(p, act==='ok' ? 'ok' : 'hold');
    return;
  }
  if(act==='sendcmt'){
    const t = val('i-cmt'); if(!t) return;
    const p = S.posts.find(x => x.id===S.sheetData);
    if(p){ const box = document.getElementById('i-cmt'); if(box) box.value=''; doComment(p, t); }
    return;
  }
  if(act==='copylink'){ copyText(inviteLink(), 'linkbox', '초대 링크를 복사했어요.'); return; }
});

  }catch(e){
    S.setupError = e && e.message==='anon' ? 'anon' : 'connect';
    S.setupDetail = (e && (e.detail || e.message)) || '';
    S.ready = true; render(); return;
  }
  const h = (location.hash||'').replace(/^#/,'').trim();
  const stored = LS.get('ddr_room');
  if(h && /^[A-Za-z0-9_-]{3,40}$/.test(h)) S.roomId = h;
  else if(stored) S.roomId = stored;
  applySession();
  S.ready = true;
  if(S.roomId) watchRoom();
  render();
})();
</script>
</body>
